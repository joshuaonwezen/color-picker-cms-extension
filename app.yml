meta:
  app_id: cms_color_picker
  display_name: Color picker
  version: 0.0.1-dev.1
  vendor: optimizely
  summary: A color field for CMS properties - a swatch, a hex input and your brand palette, with a text contrast check.
  support_url: https://www.optimizely.com
  contact_email: joshua.onwezen@optimizely.com
  categories:
    - Testing & Utilities
  availability:
    - all

runtime: node22-cms-ext

functions:
  cms_extension:
    entry_point: CmsUiExtension
    description: Serves the brand palette from the app settings.
    accepts: cms_ui_extension

ui_extensions:
  property-editor:
    # Offered for long strings (string, no format). The CMS mounts it only where an admin
    # picks it: content type -> property -> User Interface -> Editor: Color picker.
    - name: color-picker
      entry_point: ColorPicker
      display_name: Color picker
      metadata:
        property_type: string
